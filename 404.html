<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜TLA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e2233">

<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
  .notfound {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px var(--gutter) 100px;
  }
  .notfound-code {
    font-family: var(--font-en);
    font-size: clamp(48px, 10vw, 88px);
    font-weight: 700;
    color: var(--color-navy);
    line-height: 1;
  }
  .notfound-title {
    margin-top: 16px;
    font-size: clamp(20px, 3vw, 26px);
    font-weight: 700;
    color: var(--color-ink);
  }
  .notfound-body {
    margin-top: 12px;
    color: var(--color-ink);
    opacity: 0.75;
    max-width: 480px;
  }
  .notfound-btns {
    margin-top: 32px;
  }
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <a href="/" class="logo">TLA<span class="logo-sub">ーホームページ制作</span></a>
</header>

<main id="top">
  <section class="notfound">
    <p class="notfound-code en">404</p>
    <h1 class="notfound-title">お探しのページが見つかりませんでした</h1>
    <p class="notfound-body">URLが変更または削除された可能性があります。トップページから改めてお探しください。</p>
    <div class="notfound-btns">
      <a href="/" class="btn btn-primary">トップページへ戻る →</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom en">
      <span>&copy; 2026 TLA, Okinawa.</span>
      <span>Website Production, Okinawa Japan.</span>
    </div>
  </div>
</footer>

</body>
</html>
